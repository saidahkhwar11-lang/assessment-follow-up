name: Apply Diagnostic Compatibility Fix

on:
  push:
    paths:
      - 'scripts/fix-diagnostic-reader.py'
      - 'scripts/fix-admin-diagnostic-completion.py'
      - '.github/workflows/apply-diagnostic-compat-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/fix-diagnostic-reader.py
      - run: python scripts/fix-admin-diagnostic-completion.py
      - run: grep -q 'assessmentTracker/diagnosticByStudent' app/page.tsx
      - run: npm ci
      - run: npm run build
      - run: cp -a out/. ./ && touch .nojekyll
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx index.html index.txt teacher admin _next .nojekyll 404.html 404 _not-found __next.__PAGE__.txt __next._full.txt __next._head.txt __next._index.txt __next._tree.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No deployment changes to commit.'
          else
            git commit -m 'Fix Admin Diagnostic completion and rebuild tracker'
            git push origin main
          fi
