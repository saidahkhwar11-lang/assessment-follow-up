name: Apply Diagnostic Compatibility Fix

on:
  push:
    paths:
      - 'scripts/fix-diagnostic-reader.py'
      - '.github/workflows/apply-diagnostic-compat-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/fix-diagnostic-reader.py
      - run: grep -q 'resultsByStudent' app/page.tsx
      - run: npm ci
      - run: npm run build
      - run: cp -a out/. ./ && touch .nojekyll
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-diagnostic-compat-fix.yml scripts/fix-diagnostic-reader.py
          git commit -m 'Fix Diagnostic marks reader and rebuild tracker'
          git push origin main
